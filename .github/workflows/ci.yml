name: AgriMind AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agrimind
          POSTGRES_PASSWORD: agrimind123
          POSTGRES_DB: agrimind_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-style: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      env:
        DATABASE_URL: postgresql+asyncpg://agrimind:agrimind123@localhost:5432/agrimind_db
        DATABASE_URL_SYNC: postgresql://agrimind:agrimind123@localhost:5432/agrimind_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-32-chars-minimum-required
      run: |
        cd backend
        pytest tests/ -v --cov=app

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Run frontend build check
      run: |
        cd frontend
        npm run build

  mobile-analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Install mobile dependencies
      run: |
        cd mobile
        flutter pub get

    - name: Analyze Flutter codebase
      run: |
        cd mobile
        flutter analyze
